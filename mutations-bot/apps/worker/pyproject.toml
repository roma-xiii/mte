[project]
name = "worker"
version = "0.1.0"
description = "Litestar worker application"
requires-python = ">=3.11"
dependencies = [
    "core",
    "exchanges",
    "strategies",
    "trading_controls",
]

[tool.uv.sources]
core = { workspace = true }
exchanges = { workspace = true }
strategies = { workspace = true }
trading_controls = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["*.py", "tests/"]
