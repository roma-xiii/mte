[project]
name = "tester"
version = "0.1.0"
description = "Litestar tester application"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.0",
    "uvicorn[standard]>=0.30",
    "core",
    "exchanges",
    "strategies",
    "trading_controls",
    "matplotlib>=3.10.8",
]

[tool.uv.sources]
core = { workspace = true }
exchanges = { workspace = true }
strategies = { workspace = true }
trading_controls = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["*.py"]
