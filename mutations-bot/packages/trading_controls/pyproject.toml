[project]
name = "trading_controls"
version = "0.1.0"
description = "Trading engine"
requires-python = ">=3.11"
dependencies = [
    "core",
    "pandas>=3.0.2",
    "python-binance>=1.0.36",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["*.py"]
